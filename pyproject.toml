[project]
name = "mlb-ros-projections"
version = "0.1.0"
description = "Rest-of-season MLB player projections with calibrated uncertainty"
requires-python = ">=3.11"
dependencies = [
    "pybaseball>=2.2.7",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "ipykernel>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
